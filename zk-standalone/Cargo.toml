[package]
name = "zk-standalone"
version = "0.1.0"
edition = "2021"
description = "Self-contained PLONK prove + verify for the proveOwnership circuit — no Docker, no HTTP"

[dependencies]
# The ZKIR interpreter + Zkir trait glue (same crates the proof server is built from)
midnight-zkir = "=2.1.0"
transient-crypto = { package = "midnight-transient-crypto", version = "=2.1.0" }
base-crypto = { package = "midnight-base-crypto", version = "=1.0.0" }
serialize = { package = "midnight-serialize", version = "=1.1.0" }

# Pin the PLONK engine to the exact versions analyzed in the docs
midnight-proofs = "=0.7.1"
midnight-circuits = "=6.2.0"
midnight-zk-stdlib = "=1.2.0"

anyhow = "1"
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
